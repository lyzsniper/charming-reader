info:
  name: Create Knowledge Base
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/knowledge-bases"
  body:
    type: json
    data: |-
      {
        "name": "",
        "description": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/knowledge-bases"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "description": ""
          }
    response:
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "description": "",
            "created_at": "",
            "updated_at": "",
            "document_count": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/knowledge-bases"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "description": ""
          }
    response:
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }

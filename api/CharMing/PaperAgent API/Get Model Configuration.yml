info:
  name: Get Model Configuration
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseUrl}}/model-configurations/:model_id"
  params:
    - name: model_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


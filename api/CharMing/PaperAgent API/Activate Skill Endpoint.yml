info:
  name: Activate Skill Endpoint
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/skills/:skill_name/activate"
  params:
    - name: skill_name
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/skills/:skill_name/activate"
      method: POST
      params:
        - name: skill_name
          value: ""
          type: path
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/skills/:skill_name/activate"
      method: POST
      params:
        - name: skill_name
          value: ""
          type: path
    response:
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }

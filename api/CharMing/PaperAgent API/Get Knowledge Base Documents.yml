info:
  name: Get Knowledge Base Documents
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/knowledge-bases/:kb_id/documents"
  params:
    - name: kb_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/knowledge-bases/:kb_id/documents"
      method: GET
      params:
        - name: kb_id
          value: ""
          type: path
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "original_filename": "",
              "file_size": "",
              "upload_date": "",
              "is_processed": false
            }
          ]
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/knowledge-bases/:kb_id/documents"
      method: GET
      params:
        - name: kb_id
          value: ""
          type: path
    response:
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }

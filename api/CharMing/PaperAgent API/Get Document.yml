    description: Successful Response
    request:
      url: "{{baseUrl}}/documents/:doc_id"
      method: GET
      params:
        - name: doc_id
          value: ""
          type: path
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "original_filename": "",
            "file_size": "",
            "upload_date": "",
            "is_processed": false,
            "storage_object_name": "",
            "storage_path": "",
            "file_download_url": "",

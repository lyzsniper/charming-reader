info:
  name: Get Document
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/documents/:doc_id"
  params:
    - name: doc_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

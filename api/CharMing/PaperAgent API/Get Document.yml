            "content_markdown": "",
            "knowledge_bases": [
              {
                "id": "",
                "name": "",
                "description": "",
                "created_at": "",
                "updated_at": "",
                "document_count": ""
              }
            ]
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/documents/:doc_id"
      method: GET
      params:
        - name: doc_id
          value: ""
          type: path

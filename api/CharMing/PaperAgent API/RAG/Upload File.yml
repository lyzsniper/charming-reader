info:
  name: Upload File
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/rag/upload"
  body:
    type: multipart-form
    data:
      - name: file
        type: text
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/rag/upload"
      method: POST
      body:
        type: multipart-form
        data:
          - name: file
            type: text
            value: ""
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/rag/upload"
      method: POST
      body:
        type: multipart-form
        data:
          - name: file
            type: text
            value: ""
    response:
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }

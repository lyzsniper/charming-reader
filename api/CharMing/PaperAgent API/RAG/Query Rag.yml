info:
  name: Query Rag
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/rag/query"
  body:
    type: json
    data: |-
      {
        "question": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/rag/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "question": ""
          }
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/rag/query"
      method: POST
      body:
        type: json
        data: |-
          {
            "question": ""
          }
    response:
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }

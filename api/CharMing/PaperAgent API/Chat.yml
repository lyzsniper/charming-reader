meta {
  name: Chat
  type: http
  seq: 1
}

post {
  url: {{baseUrl}}/chat
  body: json
  auth: inherit
}

body:json {
  {
    "message": "你好"
  }
}

vars:pre-request {
  baseUrl: http://127.0.0.1:18000
}

settings {
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
}

example {
  name: 200 Response
  description: Successful Response
  
  request: {
    url: {{baseUrl}}/chat
    method: POST
    mode: json
    body:json: {
      {
        "message": ""
      }
    }
  }
  
  response: {
    headers: {
      Content-Type: application/json
    }
  
    status: {
      code: null
      text: OK
    }
  
    body: {
      type: json
      content: '''
  
      '''
    }
  }
}

example {
  name: 422 Response
  description: Validation Error
  
  request: {
    url: {{baseUrl}}/chat
    method: POST
    mode: json
    body:json: {
      {
        "message": ""
      }
    }
  }
  
  response: {
    headers: {
      Content-Type: application/json
    }
  
    status: {
      code: null
      text: Unprocessable Entity
    }
  
    body: {
      type: json
      content: '''
        {
          "detail": [
            {
              "loc": [],
              "msg": "",
              "type": ""
            }
          ]
        }
      '''
    }
  }
}

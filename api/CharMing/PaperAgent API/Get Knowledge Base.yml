info:
  name: Get Knowledge Base
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/knowledge-bases/:kb_id"
  params:
    - name: kb_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/knowledge-bases/:kb_id"
      method: GET
      params:
        - name: kb_id
          value: ""
          type: path
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "description": "",
            "created_at": "",
            "updated_at": "",
            "document_count": "",
            "documents": [
              {
                "id": "",
                "original_filename": "",
                "file_size": "",
                "upload_date": "",
                "is_processed": false
              }
            ]
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/knowledge-bases/:kb_id"
      method: GET
      params:
        - name: kb_id
          value: ""
          type: path
    response:
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }

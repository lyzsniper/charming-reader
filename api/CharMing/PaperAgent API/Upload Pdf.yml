info:
  name: Upload Pdf
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/upload"
  params:
    - name: knowledge_base_ids
      value: ""
      type: query
      disabled: true
  body:
    type: multipart-form
    data:
      - name: file
        type: text
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/upload"
      method: POST
      params:
        - name: knowledge_base_ids
          value: ""
          type: query
          disabled: true
      body:
        type: multipart-form
        data:
          - name: file
            type: text
            value: ""
    response:
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "original_filename": "",
            "file_size": "",
            "upload_date": "",
            "is_processed": false,
            "storage_object_name": "",
            "storage_path": "",
            "file_download_url": "",
            "content_type": "",
            "content_markdown": "",
            "knowledge_bases": [
              {
                "id": "",
                "name": "",
                "description": "",
                "created_at": "",
                "updated_at": "",
                "document_count": ""
              }
            ]
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/upload"
      method: POST
      params:
        - name: knowledge_base_ids
          value: ""
          type: query
          disabled: true
      body:
        type: multipart-form
        data:
          - name: file
            type: text
            value: ""
    response:
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
